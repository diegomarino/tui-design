[project]
name = "fleet-textual-starter"
version = "1.0.0"
description = "tui-design proto-starter: the Fleet demo screen in Textual"
requires-python = ">=3.11"
# Pinned exactly: --frame uses a private Textual API (App.screen._compositor).
dependencies = ["textual==8.2.8"]

[project.scripts]
fleet = "fleet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet"]
